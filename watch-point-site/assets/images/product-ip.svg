<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">كاميرا مراقبة IP — رسم توضيحي</title>
<desc id="desc">رسم توضيحي لكاميرا IP دوارة متصلة بالشبكة، بيانات تجريبية.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset=".58" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#D7E6FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#3B82F6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20334F"/>
      <stop offset=".48" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset=".45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0B3FA8"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E8EEF7"/>
      <stop offset="1" stop-color="#B9C7D9"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset=".5" stop-color="#334155"/>
      <stop offset="1" stop-color="#111E32"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B35"/>
      <stop offset=".5" stop-color="#173A69"/>
      <stop offset="1" stop-color="#06101F"/>
    </linearGradient>
    <radialGradient id="lens" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset=".18" stop-color="#60A5FA"/>
      <stop offset=".48" stop-color="#1D4ED8"/>
      <stop offset=".8" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2563EB" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#081A33" flood-opacity=".24"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<rect width="800" height="600" fill="url(#bg)"/>
<rect width="800" height="600" fill="url(#grid)" opacity=".85"/>
<circle cx="400" cy="290" r="285" fill="url(#glow)"/>

  <g opacity=".5" stroke="#5D8FD1" stroke-width="2" fill="none">
    <circle cx="400" cy="300" r="212" stroke-dasharray="3 9"/>
    <circle cx="400" cy="300" r="164" stroke-dasharray="2 12"/>
    <path d="M400 88v38M400 474v38M188 300h38M574 300h38M250 150l27 27M550 450l-27-27M250 450l27-27M550 150l-27 27"/>
  </g>
  <g fill="#2563EB" opacity=".55">
    <circle cx="172" cy="196" r="5"/><circle cx="632" cy="208" r="5"/><circle cx="164" cy="404" r="5"/><circle cx="638" cy="396" r="5"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="368" y="52" width="64" height="22" rx="11" fill="url(#steel)"/>
    <path d="M382 74h36v46h-36z" fill="url(#steelDark)"/>
    <ellipse cx="400" cy="122" rx="98" ry="24" fill="#7D96B5"/>
    <path d="M302 122c0 48 44 86 98 86s98-38 98-86c0-12-10-22-22-22H324c-12 0-22 10-22 22Z" fill="url(#glass)"/>
    <circle cx="400" cy="206" r="76" fill="#0A172B" stroke="#2563EB" stroke-opacity=".5" stroke-width="5"/>
    <circle cx="400" cy="206" r="55" fill="url(#lens)"/>
    <circle cx="382" cy="188" r="14" fill="#FFFFFF" opacity=".5"/>
    <circle cx="400" cy="206" r="71" fill="none" stroke="#60A5FA" stroke-opacity=".4" stroke-width="3" stroke-dasharray="6 10"/>
    <g fill="#60A5FA"><circle cx="350" cy="160" r="3"/><circle cx="450" cy="160" r="3"/><circle cx="340" cy="206" r="3"/><circle cx="460" cy="206" r="3"/></g>
    <path d="M400 282v42" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
    <rect x="342" y="320" width="116" height="24" rx="12" fill="url(#steel)"/>
    <path d="M400 344v58" stroke="#334155" stroke-width="4"/>
    <path d="M400 402c-44 34-82 18-82 62M400 402c44 34 82 18 82 62" fill="none" stroke="#2563EB" stroke-opacity=".5" stroke-width="3" stroke-dasharray="4 8"/>
  </g>
</svg>
