<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">كاميرا مراقبة داخلية — رسم توضيحي</title>
<desc id="desc">رسم توضيحي لكاميرا مراقبة داخلية مثبتة في السقف، بيانات تجريبية.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset=".58" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#D7E6FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#3B82F6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20334F"/>
      <stop offset=".48" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset=".45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0B3FA8"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E8EEF7"/>
      <stop offset="1" stop-color="#B9C7D9"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset=".5" stop-color="#334155"/>
      <stop offset="1" stop-color="#111E32"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B35"/>
      <stop offset=".5" stop-color="#173A69"/>
      <stop offset="1" stop-color="#06101F"/>
    </linearGradient>
    <radialGradient id="lens" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset=".18" stop-color="#60A5FA"/>
      <stop offset=".48" stop-color="#1D4ED8"/>
      <stop offset=".8" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2563EB" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#081A33" flood-opacity=".24"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<rect width="800" height="600" fill="url(#bg)"/>
<rect width="800" height="600" fill="url(#grid)" opacity=".85"/>
<circle cx="400" cy="290" r="285" fill="url(#glow)"/>

  <g opacity=".55">
    <path d="M90 470h620" stroke="#93B4E6" stroke-width="2" stroke-dasharray="8 10"/>
    <path d="M120 500h560" stroke="#93B4E6" stroke-width="1.5" stroke-dasharray="4 12"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="286" y="52" width="228" height="24" rx="12" fill="url(#steel)"/>
    <rect x="286" y="52" width="228" height="10" rx="5" fill="#FFFFFF" opacity=".7"/>
    <path d="M368 74h64v38h-64z" fill="url(#steelDark)"/>
    <ellipse cx="400" cy="118" rx="132" ry="30" fill="#AFC2DA"/>
    <path d="M268 118c0 78 52 140 132 140s132-62 132-140c0-17-14-30-31-30H299c-17 0-31 13-31 30Z" fill="url(#glass)"/>
    <path d="M286 122c0 60 42 108 96 116-38-18-63-56-63-105 0-9 2-18 5-26h-24c-8 0-14 6-14 15Z" fill="#FFFFFF" opacity=".13"/>
    <circle cx="400" cy="186" r="58" fill="#061426" stroke="#3B82F6" stroke-opacity=".45" stroke-width="4"/>
    <circle cx="400" cy="186" r="43" fill="url(#lens)"/>
    <circle cx="386" cy="170" r="12" fill="#FFFFFF" opacity=".5"/>
    <circle cx="400" cy="186" r="55" fill="none" stroke="#60A5FA" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 8"/>
    <g fill="#60A5FA">
      <circle cx="326" cy="150" r="3"/><circle cx="474" cy="150" r="3"/>
      <circle cx="306" cy="186" r="3"/><circle cx="494" cy="186" r="3"/>
    </g>
    <ellipse cx="400" cy="258" rx="132" ry="18" fill="#081A33" opacity=".25"/>
  </g>
</svg>
