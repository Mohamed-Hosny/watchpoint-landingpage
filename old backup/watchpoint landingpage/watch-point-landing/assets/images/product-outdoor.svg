<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">كاميرا مراقبة خارجية — رسم توضيحي</title>
<desc id="desc">رسم توضيحي لكاميرا مراقبة خارجية مقاومة للعوامل الجوية، بيانات تجريبية.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset=".58" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#D7E6FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#3B82F6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20334F"/>
      <stop offset=".48" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset=".45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0B3FA8"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E8EEF7"/>
      <stop offset="1" stop-color="#B9C7D9"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset=".5" stop-color="#334155"/>
      <stop offset="1" stop-color="#111E32"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B35"/>
      <stop offset=".5" stop-color="#173A69"/>
      <stop offset="1" stop-color="#06101F"/>
    </linearGradient>
    <radialGradient id="lens" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset=".18" stop-color="#60A5FA"/>
      <stop offset=".48" stop-color="#1D4ED8"/>
      <stop offset=".8" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2563EB" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#081A33" flood-opacity=".24"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<rect width="800" height="600" fill="url(#bg)"/>
<rect width="800" height="600" fill="url(#grid)" opacity=".85"/>
<circle cx="400" cy="290" r="285" fill="url(#glow)"/>

  <g opacity=".35">
    <path d="M0 486h800v114H0z" fill="#9DBBE6"/>
    <circle cx="670" cy="112" r="46" fill="#FFFFFF" opacity=".8"/>
    <path d="M84 486V330l86-58 86 58v156M600 486V302l58-40 58 40v184" fill="none" stroke="#6E93C7" stroke-width="3"/>
  </g>
  <g fill="#7FA3D4" opacity=".55">
    <path d="M86 108l7 17 17 7-17 7-7 17-7-17-17-7 17-7z"/>
    <path d="M708 306l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="584" y="206" width="34" height="202" rx="10" fill="url(#steelDark)"/>
    <rect x="548" y="196" width="106" height="34" rx="17" fill="url(#steel)"/>
    <circle cx="601" cy="213" r="8" fill="#94A3B8"/>
    <g transform="rotate(-4 400 290)">
      <rect x="226" y="228" width="342" height="124" rx="62" fill="url(#navy)"/>
      <rect x="248" y="244" width="260" height="36" rx="18" fill="#FFFFFF" opacity=".10"/>
      <path d="M226 290c0-34 28-62 62-62h38v124h-38c-34 0-62-28-62-62Z" fill="#0A172B"/>
      <circle cx="542" cy="290" r="67" fill="#061426" stroke="#3B82F6" stroke-opacity=".5" stroke-width="5"/>
      <circle cx="542" cy="290" r="50" fill="url(#lens)"/>
      <circle cx="526" cy="272" r="13" fill="#FFFFFF" opacity=".48"/>
      <circle cx="542" cy="290" r="63" fill="none" stroke="#60A5FA" stroke-opacity=".4" stroke-width="3" stroke-dasharray="5 9"/>
      <g fill="#60A5FA"><circle cx="505" cy="252" r="3"/><circle cx="579" cy="252" r="3"/><circle cx="505" cy="328" r="3"/><circle cx="579" cy="328" r="3"/></g>
      <rect x="268" y="258" width="108" height="64" rx="12" fill="#0F2A4D" stroke="#3B82F6" stroke-opacity=".35"/>
      <circle cx="292" cy="278" r="5" fill="#22C55E"/>
      <rect x="286" y="296" width="66" height="7" rx="3.5" fill="#3B82F6" opacity=".6"/>
      <path d="M404 240l20 50-20 50" fill="none" stroke="#3B82F6" stroke-opacity=".4" stroke-width="3"/>
    </g>
  </g>
  <g opacity=".6" stroke="#60A5FA" stroke-width="3" stroke-linecap="round">
    <path d="M120 174l-22 18M144 194l-22 18M168 214l-22 18"/>
  </g>
  <rect x="250" y="452" width="300" height="42" rx="21" fill="#FFFFFF" opacity=".82"/>
</svg>
