<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">باقة الشركات — رسم توضيحي</title>
<desc id="desc">رسم توضيحي لباقة كاميرات مراقبة للشركات والمكاتب، بيانات تجريبية.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset=".58" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#D7E6FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#3B82F6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20334F"/>
      <stop offset=".48" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset=".45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0B3FA8"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E8EEF7"/>
      <stop offset="1" stop-color="#B9C7D9"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset=".5" stop-color="#334155"/>
      <stop offset="1" stop-color="#111E32"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B35"/>
      <stop offset=".5" stop-color="#173A69"/>
      <stop offset="1" stop-color="#06101F"/>
    </linearGradient>
    <radialGradient id="lens" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset=".18" stop-color="#60A5FA"/>
      <stop offset=".48" stop-color="#1D4ED8"/>
      <stop offset=".8" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2563EB" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#081A33" flood-opacity=".24"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<rect width="800" height="600" fill="url(#bg)"/>
<rect width="800" height="600" fill="url(#grid)" opacity=".85"/>
<circle cx="400" cy="290" r="285" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="168" y="122" width="270" height="382" rx="10" fill="#FFFFFF" stroke="#C7D8EE" stroke-width="3"/>
    <rect x="438" y="208" width="194" height="296" rx="10" fill="#F4F8FE" stroke="#C7D8EE" stroke-width="3"/>
    <g fill="#BFD5F0">
      <rect x="206" y="164" width="58" height="42" rx="4"/><rect x="286" y="164" width="58" height="42" rx="4"/><rect x="366" y="164" width="34" height="42" rx="4"/>
      <rect x="206" y="230" width="58" height="42" rx="4"/><rect x="286" y="230" width="58" height="42" rx="4"/><rect x="366" y="230" width="34" height="42" rx="4"/>
      <rect x="206" y="296" width="58" height="42" rx="4"/><rect x="286" y="296" width="58" height="42" rx="4"/><rect x="366" y="296" width="34" height="42" rx="4"/>
      <rect x="206" y="362" width="58" height="42" rx="4"/><rect x="286" y="362" width="58" height="42" rx="4"/><rect x="366" y="362" width="34" height="42" rx="4"/>
      <rect x="476" y="246" width="118" height="34" rx="4"/><rect x="476" y="300" width="118" height="34" rx="4"/><rect x="476" y="354" width="118" height="34" rx="4"/>
    </g>
    <rect x="286" y="428" width="56" height="76" rx="6" fill="#94B4DD"/>
    <g transform="translate(398 160)">
      <rect x="0" y="0" width="82" height="32" rx="16" fill="#0B1B33"/>
      <circle cx="68" cy="16" r="16" fill="#173A69"/>
      <circle cx="68" cy="16" r="9" fill="url(#lens)"/>
    </g>
    <g transform="translate(128 246) scale(-1 1) translate(-82 0)">
      <rect x="0" y="0" width="82" height="32" rx="16" fill="#0B1B33"/>
      <circle cx="68" cy="16" r="16" fill="#173A69"/>
      <circle cx="68" cy="16" r="9" fill="url(#lens)"/>
    </g>
    <circle cx="608" cy="170" r="42" fill="url(#blue)"/>
    <path d="M590 170l13 14 26-29" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g opacity=".45" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 10">
    <path d="M74 520h652M74 92h652"/>
  </g>
  
</svg>
