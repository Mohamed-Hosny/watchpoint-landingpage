    <rect x="500" y="112" width="162" height="376" rx="10" fill="url(#steel)"/>
    <circle cx="576" cy="202" r="32" fill="none" stroke="#94A3B8" stroke-width="8"/>
    <path d="M548 202h56" stroke="#94A3B8" stroke-width="8"/>
    <rect x="622" y="250" width="18" height="62" rx="9" fill="#94A3B8"/>
