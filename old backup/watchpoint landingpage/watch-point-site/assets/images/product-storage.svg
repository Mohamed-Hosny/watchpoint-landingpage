<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">هارد تخزين للمراقبة — رسم توضيحي</title>
<desc id="desc">رسم توضيحي لقرص تخزين مخصص لأنظمة المراقبة، بيانات تجريبية.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset=".58" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#D7E6FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#3B82F6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20334F"/>
      <stop offset=".48" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset=".45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0B3FA8"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E8EEF7"/>
      <stop offset="1" stop-color="#B9C7D9"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset=".5" stop-color="#334155"/>
      <stop offset="1" stop-color="#111E32"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B35"/>
      <stop offset=".5" stop-color="#173A69"/>
      <stop offset="1" stop-color="#06101F"/>
    </linearGradient>
    <radialGradient id="lens" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset=".18" stop-color="#60A5FA"/>
      <stop offset=".48" stop-color="#1D4ED8"/>
      <stop offset=".8" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2563EB" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#081A33" flood-opacity=".24"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<rect width="800" height="600" fill="url(#bg)"/>
<rect width="800" height="600" fill="url(#grid)" opacity=".85"/>
<circle cx="400" cy="290" r="285" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <g transform="rotate(-8 400 300)">
      <rect x="188" y="142" width="424" height="316" rx="22" fill="url(#steelDark)"/>
      <rect x="204" y="158" width="392" height="284" rx="14" fill="#26364D"/>
      <rect x="230" y="184" width="340" height="178" rx="10" fill="#182539" stroke="#3B82F6" stroke-opacity=".3"/>
      <g transform="translate(0 0)">
        <circle cx="400" cy="273" r="74" fill="#0B1728" stroke="#3B82F6" stroke-opacity=".4" stroke-width="3"/>
        <circle cx="400" cy="273" r="56" fill="#1E3A5F"/>
        <circle cx="400" cy="273" r="18" fill="#94A3B8"/>
        <circle cx="400" cy="273" r="7" fill="#0B1728"/>
        <path d="M372 273a28 28 0 0 1 56 0" fill="none" stroke="#60A5FA" stroke-width="3" opacity=".5"/>
        <path d="M400 217v18M400 311v18M344 273h18M438 273h18" stroke="#64748B" stroke-width="4"/>
      </g>
      <rect x="230" y="374" width="340" height="42" rx="8" fill="#0B1728" stroke="#3B82F6" stroke-opacity=".3"/>
      <g fill="#60A5FA" opacity=".55">
        <rect x="248" y="388" width="80" height="7" rx="3.5"/>
        <rect x="344" y="388" width="120" height="7" rx="3.5"/>
        <rect x="480" y="388" width="68" height="7" rx="3.5"/>
      </g>
      <g fill="#94A3B8">
        <circle cx="222" cy="176" r="5"/><circle cx="578" cy="176" r="5"/><circle cx="222" cy="424" r="5"/><circle cx="578" cy="424" r="5"/>
      </g>
      <rect x="510" y="352" width="64" height="10" rx="5" fill="#3B82F6" opacity=".55"/>
    </g>
    <path d="M674 396c34 20 40 52 14 70" fill="none" stroke="#94A3B8" stroke-width="4" stroke-dasharray="5 8"/>
  </g>
  <g opacity=".45" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="3 10">
    <circle cx="400" cy="300" r="242"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#2C4F7C">
    <rect x="286" y="504" width="228" height="38" rx="19" fill="#FFFFFF" opacity=".85"/>
    <circle cx="308" cy="523" r="5" fill="#22C55E"/>
    <text x="322" y="528">Surveillance storage</text>
  </g>
  
</svg>
