<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">باقة المحلات — رسم توضيحي</title>
<desc id="desc">رسم توضيحي لباقة كاميرات مراقبة للمحلات التجارية، بيانات تجريبية.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset=".58" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#D7E6FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#3B82F6" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20334F"/>
      <stop offset=".48" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset=".45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0B3FA8"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#E8EEF7"/>
      <stop offset="1" stop-color="#B9C7D9"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748B"/>
      <stop offset=".5" stop-color="#334155"/>
      <stop offset="1" stop-color="#111E32"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1B35"/>
      <stop offset=".5" stop-color="#173A69"/>
      <stop offset="1" stop-color="#06101F"/>
    </linearGradient>
    <radialGradient id="lens" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset=".18" stop-color="#60A5FA"/>
      <stop offset=".48" stop-color="#1D4ED8"/>
      <stop offset=".8" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2563EB" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#081A33" flood-opacity=".24"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

<rect width="800" height="600" fill="url(#bg)"/>
<rect width="800" height="600" fill="url(#grid)" opacity=".85"/>
<circle cx="400" cy="290" r="285" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="130" y="226" width="540" height="278" rx="12" fill="#FFFFFF" stroke="#C7D8EE" stroke-width="3"/>
    <path d="M116 226h568l-34-66H150z" fill="url(#blue)"/>
    <g fill="#FFFFFF" opacity=".55">
      <path d="M190 160h46l-20 66h-46z"/><path d="M292 160h46l-20 66h-46z"/><path d="M394 160h46l-20 66h-46z"/><path d="M496 160h46l-20 66h-46z"/><path d="M598 160h46l-20 66h-46z"/>
    </g>
    <rect x="178" y="288" width="182" height="150" rx="8" fill="#DCE9FA" stroke="#B4CAE8" stroke-width="3"/>
    <rect x="378" y="300" width="112" height="196" rx="6" fill="#C5D9F0"/>
    <rect x="516" y="300" width="104" height="92" rx="6" fill="#DCE9FA"/>
    <rect x="220" y="318" width="98" height="16" rx="8" fill="#93B4E6"/>
    <rect x="220" y="348" width="72" height="12" rx="6" fill="#B4CAE8"/>
    <g transform="translate(484 112)">
      <rect x="0" y="0" width="92" height="36" rx="18" fill="#0B1B33"/>
      <circle cx="77" cy="18" r="18" fill="#173A69"/>
      <circle cx="77" cy="18" r="10" fill="url(#lens)"/>
      <rect x="10" y="10" width="32" height="7" rx="3.5" fill="#60A5FA" opacity=".5"/>
    </g>
    <circle cx="632" cy="154" r="36" fill="url(#blue)"/>
    <path d="M616 154l11 12 23-25" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="628" y="200" width="14" height="26" fill="#94A3B8"/>
  </g>
  <g opacity=".45" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="3 9">
    <circle cx="400" cy="360" r="252"/>
  </g>
  
</svg>
